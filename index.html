<!DOCTYPE html>
<html >
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.8">
        <title>Chrome Dinosaur Game</title>
        <link rel="stylesheet" href="dino.css">
        <script src="son.js" defer></script>
        <script src="dino.js?v=2" defer></script>
    </head>
    <body>
        <h1>Chrome Dinosaur Game</h1>
        <canvas id="board"></canvas>
        
        <div class="weather-controls">
            <p>Simulation Météo :</p>
            <button onclick="forceWeatherTheme('day')">☀️ Jour</button>
            <button onclick="forceWeatherTheme('sunset')">🌅 Coucher</button>
            <button onclick="forceWeatherTheme('night')">🌙 Nuit</button>
            <button onclick="forceWeatherTheme('rain')">🌧️ Pluie</button>
            <button onclick="forceWeatherTheme('storm')">⛈️ Orage</button>
            <button onclick="restoreAutoWeather()">🔄 Auto (météo réelle)</button>
        </div>
    </body>
</html>
